server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /health       { proxy_pass http://api:8000; }
  location /auth         { proxy_pass http://api:8000; }
  location /opportunities { proxy_pass http://api:8000; }
  location /applications  { proxy_pass http://api:8000; }
  location /placements    { proxy_pass http://api:8000; }
  location /invitations   { proxy_pass http://api:8000; }
  location /policies      { proxy_pass http://api:8000; }
}
