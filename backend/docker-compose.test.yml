services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dh05-test-only
      POSTGRES_DB: dh05_http_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dh05_http_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql://postgres:dh05-test-only@db:5432/dh05_http_test
      JWT_SECRET: dh05-test-only-secret-long-enough-for-hs256-2026
      APP_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
