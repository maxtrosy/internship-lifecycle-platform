services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-local-only-dh05-secret-change-for-any-shared-environment-2026}
      JWT_TTL_MINUTES: "15"
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      PASSWORD_RESET_DELIVERY: ${PASSWORD_RESET_DELIVERY:-development-token}
      DEMO_PASSWORD: "${DEMO_PASSWORD:-Demo-Only-2026!}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO_LOGIN_ENABLED: "true"
        VITE_DEMO_LOGIN_PASSWORD: "${DEMO_PASSWORD:-Demo-Only-2026!}"
    ports:
      - "5173:80"
    depends_on:
      - api
